# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/account/webserver.pid;
error_log /var/log/sdkwork/account/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3900;
    }
    server {
        listen 80;
        server_name account-dev.sdkwork.com account-dev.birdcoder.com account-dev.dtupay.com account-dev.sdkwork.cn account-dev.birdcoder.cn account-dev.dtupay.cn account-dev.skubc.com account-dev.skubc.cn account-dev.zowalk.com account-dev.zowalk.cn account-dev.offer86.com account-dev.offer86.cn account-dev.86offer.com account-dev.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
