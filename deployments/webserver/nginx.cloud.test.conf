# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/account/webserver.pid;
error_log /var/log/sdkwork/account/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name account-test.sdkwork.com account-test.birdcoder.com account-test.dtupay.com account-test.noaper.com account-test.sdkwork.cn account-test.birdcoder.cn account-test.dtupay.cn account-test.noaper.cn account-test.skubc.com account-test.skubc.cn account-test.zowalk.com account-test.zowalk.cn account-test.offer86.com account-test.offer86.cn account-test.86offer.com account-test.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
