schema_version: 1
kind: sdkwork.database.schema
module_id: account
contract_version: 3.0.0
owner_team: sdkwork-account
compliance_level: L3
engines:
  - postgres
  - sqlite
table_prefix: acct_
id_strategy:
  type: snowflake
  provider: sdkwork-database-id
  public_id: uuid
amount_strategy:
  storage: int64_smallest_unit
  postgres_type: BIGINT
  sqlite_type: BIGINT
  api_serialization: int64_string
  forbidden:
    - float
    - double
    - real
    - numeric_for_account_balance
account_taxonomy:
  cash:
    asset_code: cash
    currency_code_rule: ISO fiat code such as CNY or USD
  points:
    asset_code: points
    currency_code_rule: POINT
  token_bank:
    asset_code: token_bank
    currency_code_rule: TOKEN_BANK
forbidden_asset_codes:
  - token
  - compute_token
  - compute_credit
  - llm_token
  - model_token
  - auth_token
  - blockchain_token
tables:
  - name: acct_account
    profile: tenant_entity
    compliance_level: L3
    system_of_record: true
    write_owner: sdkwork-account
    description: Owner-scoped balances for cash, points, and Token Bank with available, frozen, and pending dimensions.

  - name: acct_ledger_entry
    profile: ledger_entry
    compliance_level: L3
    system_of_record: true
    write_owner: sdkwork-account
    description: Immutable append-only account balance movement ledger.

  - name: acct_journal
    profile: core_entity
    compliance_level: L3
    system_of_record: true
    write_owner: sdkwork-account
    description: Double-entry journal header for balanced account mutations.

  - name: acct_journal_line
    profile: ledger_entry
    compliance_level: L3
    system_of_record: true
    write_owner: sdkwork-account
    description: Double-entry journal lines referencing ledger entries.

  - name: acct_hold
    profile: core_entity
    compliance_level: L3
    system_of_record: true
    write_owner: sdkwork-account
    description: Pre-authorization holds moving balance from available to frozen.

  - name: acct_transfer
    profile: core_entity
    compliance_level: L3
    system_of_record: true
    write_owner: sdkwork-account
    description: Atomic same-asset inter-account transfer records.

  - name: acct_points_lot
    profile: core_entity
    compliance_level: L3
    system_of_record: true
    write_owner: sdkwork-account
    description: FEFO points lot batches with optional expiry.

  - name: acct_points_lot_allocation
    profile: ledger_entry
    compliance_level: L3
    system_of_record: true
    write_owner: sdkwork-account
    description: Immutable debit allocation rows linking ledger entries to consumed points lots.

  - name: acct_token_bank_exchange_rate
    profile: core_entity
    compliance_level: L3
    system_of_record: true
    write_owner: sdkwork-account
    description: Governed fiat-to-Token-Bank exchange-rate configuration.

  - name: acct_token_bank_exchange_quote
    profile: core_entity
    compliance_level: L3
    system_of_record: true
    write_owner: sdkwork-account
    description: Short-lived Token Bank purchase quotes generated from exchange rates.

  - name: acct_token_bank_exchange_snapshot
    profile: ledger_entry
    compliance_level: L3
    system_of_record: true
    write_owner: sdkwork-account
    description: Immutable exchange snapshots attached to purchase fulfillment and ledger entries.

  - name: acct_token_bank_settlement_snapshot
    profile: ledger_entry
    compliance_level: L3
    system_of_record: true
    write_owner: sdkwork-account
    description: Immutable AI spending, release, service income, and burn settlement evidence.

  - name: acct_idempotency_record
    profile: event_log
    compliance_level: L3
    system_of_record: true
    write_owner: sdkwork-account
    description: Scoped idempotency records for account write commands.

  - name: acct_outbox_event
    profile: outbox_event
    compliance_level: L3
    system_of_record: true
    write_owner: sdkwork-account
    description: Transactional outbox for account domain events.

  - name: acct_billing_history
    profile: projection
    compliance_level: L2
    system_of_record: false
    write_owner: sdkwork-account
    description: User-facing billing history projection sourced from account ledger and Token Bank snapshots.
